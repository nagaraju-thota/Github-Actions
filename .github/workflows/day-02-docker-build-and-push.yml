name: docker-build-and-push
on:
  workflow_dispatch
permissions:
  contents: read
  packages: write
env:
  IMAGE_NAME: docker-build-and-push
  IMAGE_TAG: ${{ github.sha }}
jobs:
  build-and-push:
    runs-on:
      ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v3
      
      - name: setup docker buildx
        uses: docker/setup-buildx-action@v2

      - name: login to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: login to github container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: build and push docker image to docker hub
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ./Day-02-docker-image-build-and-push/examples
          file: Day-02-docker-image-build-and-push/example/Dockerfile
          tags: ${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: build and push docker image to github container registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.actor }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: print the docker image name and tag
        run: echo "Docker Image Name ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: print the success message
        run: echo "Docker image build and push completed successfully."
