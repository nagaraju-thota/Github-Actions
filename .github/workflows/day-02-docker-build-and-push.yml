name: docker-build-and-push

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: docker-build-and-push
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show the repository structure
        run: |
          pwd
          ls -la
          ls -la Day-02-docker-image-build-and-push
          ls -la Day-02-docker-image-build-and-push/example

      - name: Build and push Docker image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./Day-02-docker-image-build-and-push/example
          file: ./Day-02-docker-image-build-and-push/example/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Build and push Docker image to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: ./Day-02-docker-image-build-and-push/example
          file: ./Day-02-docker-image-build-and-push/example/Dockerfile
          push: true
          tags: ghcr.io/${{ github.actor }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Print Docker image name and tag
        run: |
          echo "Docker Image Name: ${{ env.IMAGE_NAME }}"
          echo "Docker Image Tag: ${{ env.IMAGE_TAG }}"

      - name: Print success message
        run: echo "Docker image build and push completed successfully."